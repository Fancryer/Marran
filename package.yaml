name:                Marran
version:             0.2.2.0
github:              "Fancryer/Marran"
license:             BSD-3-Clause
author:              "Alice Eve Liddell"
maintainer:          "Fancryer"
copyright:           "2025 Fancryer"

extra-source-files:
- README.md
- CHANGELOG.md
- CITATION.cff

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/Fancryer/Marran#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- mtl
- megaparsec
- parser-combinators
- hspec
- QuickCheck
- text
- random
- os-string
- numeric-limits
- scientific
- comonad
- lens
- aeson
- filepath
- directory
- bytestring
- optparse-applicative
- criterion
- deepseq
- process

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  marran-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Marran

tests:
  marran-test:
    main:                Spec.hs
    source-dirs:         test
    other-modules:
      UnifySpec
      UnifyPropertySpec
      FreezePropertySpec
      GeneralizeSpec
      FreezeSpec
      ExamplesSpec
      SpanSpec
      DiagnosticSpec
      ParserSpec
      SuggestSpec
      BuiltinSpec
      ImportSpec
      BenchmarkSpec
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Marran
    - containers
    - mtl
    - megaparsec
    - parser-combinators
    - hspec
    - QuickCheck
    - text
    - random
    - os-string
    - numeric-limits
    - scientific
    - comonad
    - lens
    - aeson
    - filepath
    - directory
    - bytestring
    - optparse-applicative
    - criterion
    - deepseq
    - transformers